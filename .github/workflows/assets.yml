name: assets

# Rebuild the README images when the generator changes. Commits made with
# GITHUB_TOKEN do not trigger workflows again, so this cannot loop.
# The alternative hero (assets/hero-alt) is a one-off comparison: rebuild it by hand
# with tools/scanline/clip.py when you want to.
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/assets.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/scanline/requirements.txt
      - run: pip install -r tools/scanline/requirements.txt

      - name: Hero, tagline, divider
        run: python tools/scanline/build.py --gif

      - name: Contribution graph
        # Optional extra; a GitHub API hiccup must not block the hero
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/scanline/contrib.py KokoGecko

      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate assets"
            git pull --rebase --autostash
            git push
          fi
